# Golf Cart Optimized Journald Configuration
# This configuration optimizes systemd journal for autonomous vehicle deployment
# Install to: /etc/systemd/journald.conf.d/golfcart.conf

[Journal]
# Storage configuration for persistent logs across reboots
Storage=persistent
Compress=yes

# Size limits for production autonomous vehicle deployment
# These limits balance comprehensive logging with disk space management
SystemMaxUse=2G
SystemKeepFree=1G
SystemMaxFileSize=200M
SystemMaxFiles=20

# Runtime logs (in-memory during operation)
RuntimeMaxUse=500M
RuntimeKeepFree=100M
RuntimeMaxFileSize=100M
RuntimeMaxFiles=10

# Retention policy - keep logs for analysis of vehicle behavior patterns
MaxRetentionSec=30day
MaxFileSec=7day

# Forward logs to traditional syslog for compatibility
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no

# Rate limiting to prevent log flooding during sensor data bursts
RateLimitInterval=30s
RateLimitBurst=10000

# Sync interval for autonomous vehicle reliability
SyncIntervalSec=5m

# Audit configuration for security in production vehicles
Audit=yes

# Kernel message handling
TTYPath=/dev/console
LineMax=48K

# Sealing for log integrity (requires persistent storage)
Seal=yes