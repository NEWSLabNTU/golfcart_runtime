# Golf Cart Launch Configuration
# This file is sourced by the production launch script
# Modify these values according to your deployment needs

# Restart behavior
MAX_RESTART_ATTEMPTS=5        # Maximum number of automatic restart attempts
RESTART_DELAY=10              # Delay in seconds between restart attempts
HEALTH_CHECK_INTERVAL=30      # Health check interval in seconds

# Logging configuration
LOG_LEVEL=INFO                # Available: DEBUG, INFO, WARN, ERROR
ENABLE_SYSTEMD_LOGGING=true   # Send logs to systemd journal
LOG_ROTATION_SIZE=100M        # Maximum size per log file
LOG_RETENTION_DAYS=30         # Days to keep log files

# Performance tuning
RVIZ_DISPLAY=false           # Disable RViz for headless operation
USE_REAL_TIME_PRIORITY=true  # Enable real-time scheduling if supported
CPU_AFFINITY=""              # CPU cores to pin processes to (e.g., "0-3")

# Hardware configuration
SENSOR_KIT_MODEL=golfcart_sensor_kit  # Sensor kit configuration
VEHICLE_MODEL=golfcart_vehicle        # Vehicle model configuration
MAP_PATH=./data/COSS-map-planning    # Default map path

# Network configuration
ENABLE_NETWORK_CHECKS=true   # Check network interfaces during startup
SENSOR_NETWORK_TIMEOUT=30    # Timeout for sensor network connectivity

# Debug and development
DEBUG_MODE=false             # Enable debug logging and extended checks
PROFILING_ENABLED=false      # Enable performance profiling